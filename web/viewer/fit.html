<!doctype html>
<html lang="ko">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>아바타 피팅 확인</title>
      <style>
            body { margin: 0; overflow: hidden; background: #eeeae4; font: 14px sans-serif; color: #333; }
            canvas { display: block; }
            #panel {
                  position: fixed; top: 16px; left: 16px; width: 240px; max-height: calc(100vh - 32px); overflow: auto;
                  background: rgba(255, 255, 255, 0.85); border-radius: 10px; padding: 12px 14px; box-sizing: border-box;
            }
            #panel h3 { margin: 4px 0 8px; font-size: 13px; }
            #outfits button { margin: 0 6px 6px 0; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
            #outfits button.on { background: #333; color: #fff; border-color: #333; }
            label { display: block; margin: 6px 0 2px; font-size: 12px; }
            input[type=range] { width: 100%; }
            #status { margin-top: 8px; font-size: 12px; color: #666; }
            @media (max-width: 600px) { #panel { width: calc(100vw - 32px); max-height: 40vh; } }
      </style>
      <script type="importmap">
            {
                  "imports": {
                        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
                  }
            }
      </script>
</head>
<body>
      <div id="panel">
            <h3>의상</h3>
            <div id="outfits"></div>
            <h3>포즈 (피팅 확인용)</h3>
            <div id="sliders"></div>
            <button id="reset">포즈 초기화</button>
            <div id="status">모델을 불러오는 중입니다...</div>
      </div>
      <script type="module" src="./fit.js"></script>
</body>
</html>
