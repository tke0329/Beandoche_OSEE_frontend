<!doctype html>
<html lang="ko">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>아바타 보기</title>
      <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
            canvas { display: block; width: 100%; height: 100%; touch-action: none; }
            #status {
                  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                  font: 13px sans-serif; color: #7a7f87; pointer-events: none;
            }
            #hint {
                  position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
                  font: 12px sans-serif; color: #9aa0a8; pointer-events: none; opacity: 0; transition: opacity .3s;
            }
      </style>
      <script type="importmap">
            {
                  "imports": {
                        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
                  }
            }
      </script>
</head>
<body>
      <div id="status">아바타를 불러오는 중...</div>
      <div id="hint">드래그해서 돌려보기 · 스크롤로 확대</div>
      <script type="module" src="./avatar-bootstrap.js"></script>
</body>
</html>
